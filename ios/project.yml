name: KadobabaGPS
options:
  bundleIdPrefix: com.kadobabacloud
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  KadobabaGPS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kadobabacloud GPS
        CFBundleName: KadobabaGPS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "Konumunuz takip panelinde gösterilir."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Uygulama kapalıyken de konum göndermek için 'Her zaman' izni gerekir."
        NSLocationAlwaysUsageDescription: "Uygulama kapalıyken de konum göndermek için 'Her zaman' izni gerekir."
        NSMotionUsageDescription: "Adım ve mesafe bilgisi için hareket verisi kullanılır."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadobabacloud.gps
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  KadobabaGPS:
    build:
      targets:
        KadobabaGPS: all
    run:
      config: Debug
    archive:
      config: Release
