name: APK Derle

# Projeyi her gönderdiğinizde (push) veya elle tetiklediğinizde çalışır.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest sunucusunda Android SDK (platform-34 + build-tools) hazır gelir;
      # ayrı bir kurulum adımına gerek yok.
      - name: APK derle (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kadobabacloud-gps-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
