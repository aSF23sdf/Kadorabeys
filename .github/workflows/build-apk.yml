name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK derle (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: kadobabacloud-gps-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK'yı apk-output dalına yaz
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/kadobabacloud-gps.apk
          git checkout --orphan apk-output
          git reset
          git add -f output/kadobabacloud-gps.apk
          git commit -m "APK build output [skip ci]"
          git push -f origin apk-output
